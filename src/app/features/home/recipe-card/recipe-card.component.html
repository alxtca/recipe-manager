<mat-card
  class="recipe-card"
  appearance="outlined"
  [routerLink]="['/recipe', recipe().id]"
  tabindex="0"
  role="link"
  [attr.aria-label]="'View ' + recipe().name"
>
  <div class="recipe-picture">
    @if (recipe().iconKey) {
      <mat-icon class="recipe-icon">{{ recipe().iconKey }}</mat-icon>
    } @else {
      <mat-icon class="recipe-icon placeholder">no_photography</mat-icon>
    }
  </div>

  <mat-card-header>
    <mat-card-title>{{ recipe().name }}</mat-card-title>
    <mat-card-subtitle>{{ recipe().cuisine }} · by {{ recipe().userName }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <!-- Rating controls must not trigger the card's navigation to the detail page. -->
    <div class="card-rating" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <app-recipe-rating
        [average]="average()"
        [count]="count()"
        [userRating]="userRating()"
        [canRate]="!!currentUserId()"
        (rated)="rate.emit($event)"
      ></app-recipe-rating>
    </div>

    <div class="ingredient-chips">
      @for (ingredient of recipe().ingredients; track ingredient.name) {
        <mat-chip disabled>{{ ingredient.name }}</mat-chip>
      }
    </div>
  </mat-card-content>
</mat-card>
