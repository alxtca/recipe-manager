<div class="dashboard-header">
  <h1>My Dashboard</h1>
  <a mat-raised-button color="primary" routerLink="/dashboard/add">
    <mat-icon>add</mat-icon>
    Add recipe
  </a>
</div>

@if (myRecipes().length) {
  <div class="my-recipe-list">
    @for (recipe of myRecipes(); track recipe.id) {
      <mat-card class="my-recipe-card" appearance="outlined">
        <mat-card-header>
          @if (recipe.iconKey) {
            <mat-icon mat-card-avatar>{{ recipe.iconKey }}</mat-icon>
          }
          <mat-card-title>{{ recipe.name }}</mat-card-title>
          <mat-card-subtitle>{{ recipe.cuisine }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions align="end">
          <a mat-button [routerLink]="['/dashboard/edit', recipe.id]">
            <mat-icon>edit</mat-icon>
            Edit
          </a>
          <button mat-button color="warn" (click)="deleteRecipe(recipe.id, recipe.name)">
            <mat-icon>delete</mat-icon>
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
} @else {
  <p class="empty-state">You haven't added any recipes yet.</p>
}
